<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BlackEyeTech builds practical technology for a smarter digital future.">
  <title>BlackEyeTech | Building the Future</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
      line-height: 1.6;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #283047;
    }

    .logo { font-size: 24px; font-weight: bold; }
    .logo span { color: #62e6c4; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px;
      text-align: center;
    }

    .tag {
      color: #62e6c4;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.1;
      margin: 24px 0;
    }

    h1 span { color: #62e6c4; }

    p {
      color: #b8c1d9;
      font-size: 18px;
      max-width: 620px;
      margin: 0 auto 32px;
    }

    .button {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 8px;
      background: #62e6c4;
      color: #0b1020;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid #283047;
      color: #b8c1d9;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BlackEye<span>Tech</span></div>
  </header>

  <main>
    <div class="tag">Technology · Innovation · Impact</div>
    <h1>Building a <span>smarter</span> digital future.</h1>
    <p>
      BlackEyeTech is building practical technology
      solutions to help people and businesses move forward.
      This is the beginning of our journey.
    </p>
    <a class="button" href="mailto:hello@blackeyetech.me">
      Get in touch
    </a>
  </main>

  <footer>
    © 2026 BlackEyeTech. All rights reserved.
  </footer>
</body>
</html>
